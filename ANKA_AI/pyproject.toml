[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "anka-ai"
version = "9.0.0"
description = "Anka — Gelişmiş Nöral Kontrol Ajanı. API key gerektirmez!"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
